name: Unsigned Darmaltoon Windows Installer

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/unsigned-windows-package.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-2025
    timeout-minutes: 40
    env:
      VERSION: "1.0.12"
      DARMALTOON_SIGNING_PFX_BASE64: ""
      DARMALTOON_SIGNING_PFX_PASSWORD: ""
    steps:
      - name: Checkout merged code
        uses: actions/checkout@v4
      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed" }
      - name: Publish standalone desktop and updater
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $out = Join-Path $env:GITHUB_WORKSPACE "artifacts/unsigned"
          $app = Join-Path $out "app"
          dotnet publish src/BusinessOS.Pharmacy.Desktop/BusinessOS.Pharmacy.Desktop.csproj -c Release -r win-x64 --self-contained true -p:Version=$env:VERSION -p:PublishReadyToRun=true -p:PublishSingleFile=false -o $app
          if ($LASTEXITCODE -ne 0) { throw "Desktop publish failed" }
          dotnet publish src/BusinessOS.Pharmacy.Updater/BusinessOS.Pharmacy.Updater.csproj -c Release -r win-x64 --self-contained true -p:Version=$env:VERSION -p:PublishSingleFile=false -o (Join-Path $out "updater")
          if ($LASTEXITCODE -ne 0) { throw "Updater publish failed" }
          New-Item -ItemType Directory -Force -Path (Join-Path $app "Updater") | Out-Null
          Copy-Item (Join-Path $out "updater/*") (Join-Path $app "Updater") -Recurse -Force
          Set-Content (Join-Path $app "deployment-default.txt") -Value "Standalone" -Encoding ascii
          if (!(Test-Path (Join-Path $app "Darmaltoon.exe"))) { throw "Missing app exe" }
          if (!(Test-Path (Join-Path $app "appsettings.json"))) { throw "Missing appsettings" }
      - name: Compile unsigned setup exe and portable zip
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $out = Join-Path $env:GITHUB_WORKSPACE "artifacts/unsigned"
          $app = Join-Path $out "app"
          $compilerCandidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 7\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 7\ISCC.exe"
          )
          $compiler = $compilerCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (!$compiler) { throw "Inno Setup compiler not found" }
          $filename = "Darmaltoon-Standalone-Unsigned-Setup-$env:VERSION-win-x64"
          & $compiler "/DMyAppVersion=$env:VERSION" "/DSourceDir=$app" "/DDeploymentMode=Standalone" "/DModeLabel=Standalone" "/DOutputDir=$out" "/DOutputBaseFilename=$filename" "/DAppIconFile=$env:GITHUB_WORKSPACE\src\BusinessOS.Pharmacy.Desktop\Assets\Darmaltoon.ico" "packaging/windows/Darmaltoon.iss"
          if ($LASTEXITCODE -ne 0) { throw "Installer compile failed" }
          $setup = Join-Path $out "$filename.exe"
          if (!(Test-Path $setup)) { throw "Installer file not produced" }
          if ((Get-AuthenticodeSignature $setup).Status -ne "NotSigned") { throw "Output must be unsigned" }
          if ((Get-AuthenticodeSignature (Join-Path $app "Darmaltoon.exe")).Status -ne "NotSigned") { throw "Desktop executable must be unsigned" }
          Compress-Archive -Path (Join-Path $app '*') -DestinationPath (Join-Path $out "Darmaltoon-Standalone-Unsigned-Portable-$env:VERSION-win-x64.zip") -CompressionLevel Optimal
          (Get-FileHash $setup -Algorithm SHA256).Hash | Set-Content (Join-Path $out "setup-sha256.txt")
      - name: Upload unsigned Windows package
        uses: actions/upload-artifact@v4
        with:
          name: Darmaltoon-Unsigned-Standalone-1.0.12
          path: |
            artifacts/unsigned/Darmaltoon-Standalone-Unsigned-Setup-1.0.12-win-x64.exe
            artifacts/unsigned/Darmaltoon-Standalone-Unsigned-Portable-1.0.12-win-x64.zip
            artifacts/unsigned/setup-sha256.txt
          retention-days: 30
          if-no-files-found: error
