name: ui-visual-regression

on:
  push:
    branches:
      - "feat/ui-*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-visual-qa:
    runs-on: windows-2025
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore solution
        run: dotnet restore BusinessOS.Pharmacy.sln

      - name: Restore screenshot harness
        run: dotnet restore tools/DashboardScreenshot/DashboardScreenshot.csproj

      - name: Release build
        run: dotnet build BusinessOS.Pharmacy.sln -c Release --no-restore

      - name: Build screenshot harness
        run: dotnet build tools/DashboardScreenshot/DashboardScreenshot.csproj -c Release --no-restore

      - name: Unit tests
        run: dotnet test tests/BusinessOS.Pharmacy.UnitTests/BusinessOS.Pharmacy.UnitTests.csproj -c Release --no-build --verbosity minimal

      - name: Integration tests
        run: dotnet test tests/BusinessOS.Pharmacy.IntegrationTests/BusinessOS.Pharmacy.IntegrationTests.csproj -c Release --no-build --verbosity minimal

      - name: Capture real WPF dashboard, POS and payment dialog
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/ui | Out-Null
          dotnet run --project tools/DashboardScreenshot/DashboardScreenshot.csproj -c Release --no-build -- artifacts/ui/dashboard-real.png dashboard
          dotnet run --project tools/DashboardScreenshot/DashboardScreenshot.csproj -c Release --no-build -- artifacts/ui/pos-real.png pos
          dotnet run --project tools/DashboardScreenshot/DashboardScreenshot.csproj -c Release --no-build -- artifacts/ui/pos-payment-real.png pos-payment
          dotnet run --project tools/DashboardScreenshot/DashboardScreenshot.csproj -c Release --no-build -- artifacts/ui/notification-toast-real.png notification-toast
          dotnet run --project tools/DashboardScreenshot/DashboardScreenshot.csproj -c Release --no-build -- artifacts/ui/roles-permissions-real.png roles-permissions
          dotnet run --project tools/DashboardScreenshot/DashboardScreenshot.csproj -c Release --no-build -- artifacts/ui/roles-permissions-glass-real.png roles-permissions-glass
          if (-not (Test-Path artifacts/ui/dashboard-real.png)) {
            throw "Real WPF dashboard screenshot was not produced."
          }
          if (-not (Test-Path artifacts/ui/pos-real.png)) {
            throw "Real WPF POS screenshot was not produced."
          }
          if (-not (Test-Path artifacts/ui/pos-payment-real.png)) {
            throw "Real WPF POS payment dialog screenshot was not produced."
          }
          if (-not (Test-Path artifacts/ui/notification-toast-real.png)) {
            throw "Real WPF notification toast screenshot was not produced."
          }
          if (-not (Test-Path artifacts/ui/roles-permissions-real.png)) {
            throw "Real WPF Roles & Permissions screenshot was not produced."
          }
          if (-not (Test-Path artifacts/ui/roles-permissions-glass-real.png)) {
            throw "Real WPF glass Roles & Permissions screenshot was not produced."
          }

      - name: Upload visual QA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Darmaltoon-UI-Visual-QA
          path: artifacts/ui/*.png
          if-no-files-found: error
          retention-days: 30
