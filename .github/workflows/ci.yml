name: desktop-ci

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: "**/*.csproj"
      - name: Restore
        run: dotnet restore BusinessOS.Pharmacy.sln
      - name: Build
        run: dotnet build BusinessOS.Pharmacy.sln --configuration Release --no-restore
      - name: Unit tests
        run: dotnet test tests/BusinessOS.Pharmacy.UnitTests/BusinessOS.Pharmacy.UnitTests.csproj --configuration Release --no-build --verbosity normal
      - name: Integration tests
        run: dotnet test tests/BusinessOS.Pharmacy.IntegrationTests/BusinessOS.Pharmacy.IntegrationTests.csproj --configuration Release --no-build --verbosity normal
      - name: Vulnerable packages
        run: dotnet list BusinessOS.Pharmacy.sln package --vulnerable --include-transitive
